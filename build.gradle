plugins {
  id("io.micronaut.application") version "5.0.0"
  id("com.gradleup.shadow") version "9.4.1"
  id("io.micronaut.aot") version "5.0.0"
  
  id "maven-publish"
  id "eclipse"
}

group = projectGroupId
ext {
    dependencyVersions = [
        'commons.codec': [
                version: commonsCodecVersion,
                group  : 'commons-codec',
                name   : 'commons-codec',
                modules: []
        ],
        'commons.lang3': [
                version: commonsLang3Version,
                group  : 'org.apache.commons',
                name   : 'commons-lang3',
                modules: []
        ],
        
        'poi': [
                version: poiVersion,
                group  : 'org.apache.poi',
                name   : 'poi',
                modules: ['poi-ooxml']
        ],
        
        'freemarker': [
                version: freemarkerVersion,
                group  : 'org.freemarker',
                name   : 'freemarker',
                modules: ['freemarker']
        ],
        
        micronaut: [
                version: micronautVersion,
                group  : 'io.micronaut',
                name   : 'micronaut-bom',
                bom    : true,
        ]
    ]
}


java {
    sourceCompatibility = JavaVersion.toVersion("25")
    targetCompatibility = JavaVersion.toVersion("25")
}
micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.example.*")
    }
}

application {
    mainClass = "com.example.Application"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"  
}

// NEXUS_USERNAME等变量在我们主项目的gradle.properties中可以找到
def getRepositoryUsername() {
    return System.getenv("NEXUS_USERNAME")
}

def getRepositoryPassword() {
    return System.getenv("NEXUS_PASSWORD")
}

configure(allprojects) { project ->
	version = qualifyVersionIfNecessary(version)
	if(project.name.startsWith("service")){
		group=projectServiceGroupId 
	}else if(project.name.startsWith("starter")){
		group=projectStarterGroupId 
	}else{
		group=projectGroupId
	}
	
	
	if (!project.name.contains("jalorx-bom")) {
	 	apply plugin: "java-library"
	 	apply from: "${rootProject.rootDir}/gradle/publishing.gradle"

        //sourceCompatibility = '21'
        //targetCompatibility = '21'
        compileJava.options.compilerArgs.add '-parameters'
        compileTestJava.options.compilerArgs.add '-parameters'
        
        // 为所有子模块应用 Micronaut 插件
        if (project.name == "jalorx-boot" || project.name.startsWith("service")) {
            apply plugin: "io.micronaut.application"
        }
        
        dependencies {
           implementation(platform("io.micronaut.platform:micronaut-platform"))
            // for build
		   annotationProcessor "io.micronaut:micronaut-inject-java"
		   annotationProcessor "io.micronaut.security:micronaut-security-annotations"
		   annotationProcessor "io.micronaut.validation:micronaut-validation-processor"
		   annotationProcessor "io.micronaut.data:micronaut-data-processor"
		   
		   implementation "io.micronaut.data:micronaut-data-tx"
		   implementation "io.micronaut.data:micronaut-data-jdbc"
		   implementation "io.micronaut.data:micronaut-data-model"
		   implementation "io.micronaut.data:micronaut-data-runtime"
		   implementation "jakarta.persistence:jakarta.persistence-api:$jakartaPersistenceVersion"
		   //implementation "javax.persistence:javax.persistence-api"
		
		   implementation "io.projectreactor:reactor-core"
		  
		   implementation "io.micronaut:micronaut-core"
		   implementation "io.micronaut:micronaut-inject"
		   implementation "io.micronaut:micronaut-runtime"
		   implementation "io.micronaut:micronaut-http"
		   implementation "io.micronaut.security:micronaut-security"
		   implementation "io.micronaut.validation:micronaut-validation"
		   implementation "io.micronaut.session:micronaut-session"
		   implementation "commons-codec:commons-codec:$commonsCodecVersion"
		   implementation "org.apache.commons:commons-lang3:$commonsLang3Version"
		   
		   implementation "io.swagger.core.v3:swagger-annotations"
		   implementation "io.micronaut:micronaut-http-server"
		   implementation "io.micronaut:micronaut-http-server-netty"
		   
		   compileOnly "io.micronaut:micronaut-inject-java"
		 }
	
	}
	

	configurations.all {
		// Check for updates every build
		resolutionStrategy.cacheChangingModulesFor 0, "seconds"
	}

	def commonCompilerArgs =
			["-Xlint:serial", "-Xlint:cast", "-Xlint:classfile", "-Xlint:dep-ann",
			 "-Xlint:divzero", "-Xlint:empty", "-Xlint:finally", "-Xlint:overrides",
			 "-Xlint:path", /*"-Xlint:processing",*/ "-Xlint:static", "-Xlint:try", "-Xlint:-options"]

	compileJava.options*.compilerArgs = commonCompilerArgs +
			["-Xlint:varargs", "-Xlint:fallthrough", "-Xlint:rawtypes",
			 "-Xlint:deprecation", "-Xlint:unchecked"]

	compileTestJava.options*.compilerArgs = commonCompilerArgs +
			["-Xlint:-varargs", "-Xlint:-fallthrough", "-Xlint:-rawtypes",
			 "-Xlint:-deprecation", "-Xlint:-unchecked"]

	compileJava {
		//sourceCompatibility = 21  // can be switched to 11 for testing
		//targetCompatibility = 21
		options.encoding = "UTF-8"
	}

	compileTestJava {
		//sourceCompatibility = 21 // can be switched to 11 for testing
		//targetCompatibility = 21
		options.encoding = "UTF-8"
		options.compilerArgs += "-parameters"
	}


	test {
		systemProperty("java.awt.headless", "true")
		//systemProperty("testGroups", project.properties.get("testGroups"))
		scanForTestClasses = false
		include(["**/*Tests.class", "**/*Test.class"])
		// Since we set scanForTestClasses to false, we need to filter out inner
		// classes with the "$" pattern; otherwise, using -Dtest.single=MyTests to
		// run MyTests by itself will fail if MyTests contains any inner classes.
		exclude(["**/Abstract*.class", '**/*$*'])
		reports.junitXml.outputLocation = file("$buildDir/test-results")
	}
	
	repositories {
	    mavenLocal()
	    mavenCentral()
	    //maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots/" }
	}
	
}

def qualifyVersionIfNecessary(version) {
	if (rootProject.hasProperty("BRANCH_NAME")) {
		def qualifier = rootProject.getProperty("BRANCH_NAME")
		if (qualifier.startsWith("SPR-")) {
			return version.replace("BUILD", qualifier)
		}
	}
	return version
}

eclipse {
    classpath {
       //downloadSources=true
    }
}
